name: rlts_mobile
description: "Return Logistics Tracking System - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.7.0
  
  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  
  # Navigation
  go_router: ^14.6.2
  
  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.4
  
  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_image_compress: ^2.3.0
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # QR Code
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  
  # Signature
  signature: ^5.5.0
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  
  # UI
  timeline_tile: ^2.0.0
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.1
  
  # Utilities
  intl: ^0.20.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
